name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # lib/lua-lifetime, lib/tl and lib/love-api: the build needs them.
      # Any SSH URL is rewritten to HTTPS so no deploy key is needed.
      - name: Check out submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Install luajit and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit lua-check

      # Transpile, type-check and generate; fails on any error.
      - name: Build
        run: ./build-code.sh

      - name: Test (LuaJIT)
        run: ./test-code.sh

      - name: Lint
        run: ./lint-code.sh

  love-test:
    name: Test (LÖVE)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Check out submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      # luajit runs the build; LÖVE runs the built suite.
      - name: Install luajit and LÖVE
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit love

      - name: Build
        run: ./build-code.sh

      # Dummy SDL drivers let LÖVE run without a display or audio device.
      - name: Test
        run: love . test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
